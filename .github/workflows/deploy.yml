name: Deploy Fabula Next

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        run: |
          for secret in HOST USERNAME PORT KEY; do
            if [ -z "${{ secrets[secret] }}" ]; then
              echo "❌ Missing secret: $secret"
              exit 1
            fi
          done
          echo "✅ All required secrets are configured."

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 30m

          script: |
            set -e

            APP_DIR="/var/www/Product/production/pr_fabula_next_frontend"

            echo "==================================="
            echo "🚀 Starting Deployment"
            echo "==================================="

            cd $APP_DIR

            echo "Current Directory:"
            pwd

            echo "Fetching latest code..."
            git fetch origin
            git reset --hard origin/main

            echo "Current Commit:"
            git log -1 --oneline

            echo "Stopping old containers..."
            docker compose down

            echo "Building latest image..."
            docker compose up -d --build

            echo "Waiting for application..."
            sleep 20

            echo "Running containers:"
            docker ps

            echo "Checking container health..."
            docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' fabula-next || true

            echo "Testing application..."
            curl --fail http://127.0.0.1:4799

            echo "Cleaning unused Docker images..."
            docker image prune -f

            echo "==================================="
            echo "✅ Deployment Successful"
            echo "==================================="