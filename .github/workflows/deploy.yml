name: Deploy Fabula Next

on:
  push:
    branches:
      - main

concurrency:
  group: production-deployment
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate Required Secrets
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          PORT: ${{ secrets.PORT }}
          KEY: ${{ secrets.KEY }}
        run: |
          set -e

          for secret in HOST USERNAME PORT KEY; do
            if [ -z "${!secret}" ]; then
              echo "❌ Missing GitHub Secret: $secret"
              exit 1
            fi
          done

          echo "✅ All required secrets are available."

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}
          command_timeout: 30m

          script: |
            set -e

            APP_DIR="/var/www/Product/production/pr_fabula_next_frontend"

            echo "===================================="
            echo "🚀 Starting Deployment"
            echo "===================================="

            cd "$APP_DIR"

            echo "Current Directory:"
            pwd

            echo "Current Branch:"
            git branch --show-current

            echo "Fetching latest code..."
            git fetch origin

            echo "Resetting to latest main..."
            git reset --hard origin/main

            echo "Latest Commit:"
            git log -1 --oneline

            echo "Docker Compose Version:"
            docker compose version

            echo "Building latest application..."
            docker compose up -d --build --remove-orphans

            echo "Waiting for application..."
            sleep 15

            echo "Container Status:"
            docker compose ps

            echo "Docker Containers:"
            docker ps

            echo "Running Health Check..."

            for i in {1..10}; do
              if curl --silent --fail http://127.0.0.1:4799 >/dev/null; then
                echo "✅ Application is healthy."
                break
              fi

              if [ "$i" -eq 10 ]; then
                echo "❌ Health check failed."
                exit 1
              fi

              echo "Retrying... ($i/10)"
              sleep 5
            done

            echo "Cleaning Docker images..."
            docker image prune -f

            echo "===================================="
            echo "✅ Deployment Completed Successfully"
            echo "===================================="

      - name: Collect Logs On Failure
        if: failure()
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.KEY }}
          port: ${{ secrets.PORT }}

          script: |
            cd /var/www/Product/production/pr_fabula_next_frontend

            echo "========== docker compose ps =========="
            docker compose ps

            echo

            echo "========== docker ps =========="
            docker ps -a

            echo

            echo "========== docker compose logs =========="
            docker compose logs --tail=200

            echo

            echo "========== Disk Usage =========="
            df -h

            echo

            echo "========== Memory =========="
            free -h